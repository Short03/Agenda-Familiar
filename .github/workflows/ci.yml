name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The Cypress binary is only needed by the e2e job.
      - run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Cypress, Chrome)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The Cypress binary (~500 MB) is cached per lockfile, so most runs skip the download.
      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Install Cypress binary (with retries)
        run: |
          for attempt in 1 2 3; do
            pnpm exec cypress install && pnpm exec cypress verify && exit 0
            echo "Attempt $attempt failed, retrying in 15 s"
            sleep 15
          done
          exit 1

      # Same as production: build, then serve the static files.
      - run: pnpm build

      # Plain shell instead of cypress-io/github-action: its wait-on gave up after 1 s with
      # "Socket closed before the connection was established" while the server was starting,
      # instead of retrying. curl retries until the server answers.
      - name: Run Cypress against the production build
        run: |
          pnpm exec vite preview --port 4173 --strictPort &
          for second in $(seq 60); do
            curl --silent --fail --output /dev/null http://localhost:4173 && break
            sleep 1
          done
          curl --silent --fail --output /dev/null http://localhost:4173
          # Two Cypress runs: the PWA spec needs a browser no other spec has touched.
          pnpm e2e:run

      - name: Upload screenshots of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
