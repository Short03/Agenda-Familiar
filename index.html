<!doctype html>
<html lang="es" data-theme="kawaii">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5f8" />
    <meta name="description" content="Calendario y tareas de la familia." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <!-- iPhone: Home Screen icon (no transparency) and full-screen app mode -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Agenda" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Agenda familiar</title>
    <!--
      Anti-flash: apply the saved theme before the first paint.
      Plain JS on purpose (it does not go through Vite). Keep the theme names and
      colors in sync with src/features/theme/themes.ts.
    -->
    <script>
      ;(function () {
        var colors = { kawaii: '#fff5f8', aventura: '#0f2418' }
        var theme = 'kawaii'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'kawaii' || saved === 'aventura') theme = saved
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
