<!doctype html>
<html lang="es" data-theme="kawaii">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5f8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Agenda familiar</title>
    <!--
      Anti-flash: apply the saved theme before the first paint.
      Plain JS on purpose (it does not go through Vite). Keep the theme names and
      colors in sync with src/features/theme/themes.ts.
    -->
    <script>
      ;(function () {
        var colors = { kawaii: '#fff5f8', aventura: '#0f2418' }
        var theme = 'kawaii'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'kawaii' || saved === 'aventura') theme = saved
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
